<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="192" height="192" rx="40" fill="url(#grad1)"/>
  
  <!-- Dumbbell Icon -->
  <g transform="translate(96, 96)">
    <!-- Left weight -->
    <rect x="-65" y="-25" width="20" height="50" rx="5" fill="white"/>
    <!-- Right weight -->
    <rect x="45" y="-25" width="20" height="50" rx="5" fill="white"/>
    <!-- Bar -->
    <rect x="-45" y="-8" width="90" height="16" rx="8" fill="white"/>
    <!-- Left grip -->
    <rect x="-35" y="-15" width="8" height="30" rx="4" fill="#4CAF50"/>
    <rect x="-23" y="-15" width="8" height="30" rx="4" fill="#4CAF50"/>
    <!-- Right grip -->
    <rect x="15" y="-15" width="8" height="30" rx="4" fill="#4CAF50"/>
    <rect x="27" y="-15" width="8" height="30" rx="4" fill="#4CAF50"/>
  </g>
  
  <!-- Counter badge -->
  <circle cx="145" cy="47" r="30" fill="#4CAF50"/>
  <text x="145" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">+</text>
</svg>
